# Skip configuration for OVPNPanel module
#
# 本目录同时承载 Android 侧的原生 Kotlin 桥接代码（AppEnv / VpnBridge 等）：
# Skip 会把 Sources/<Module>/Skip 下的 .kt 文件一并编译进转译模块，
# 因此 Swift 的 `#if SKIP import com.ovpn.panel.Xxx` 可以直接引用它们。

# this is a transpiled Skip Lite module
skip:
  mode: 'transpiled'

# the blocks to add to the module's build.gradle.kts
build:
  contents:
    - block: 'dependencies'
      export: false
      contents:
        # OpenVPN 3 内核：与改造前 Android 版完全一致，保证 VPN 行为不变
        - 'implementation("io.github.tim06:openvpn:1.1.3")'
        - 'implementation("io.github.tim06:basevpnprotocols:1.1.0")'
        - 'implementation("io.github.tim06:vpnprotocolsnotification:1.1.0")'