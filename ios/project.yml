name: OVPNPanel

options:
  bundleIdPrefix: com.ovpn
  # 构建机为 Xcode 15.4（macos-14），必须生成 Xcode 15 兼容的工程格式，
  # 否则默认的 xcode16_0 格式会报 "future Xcode project file format (77)"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  OVPNPanel:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/OVPNPanel
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ovpn.panel
        PRODUCT_NAME: OVPN
        INFOPLIST_FILE: Sources/OVPNPanel/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64

schemes:
  OVPNPanel:
    build:
      targets:
        OVPNPanel: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release