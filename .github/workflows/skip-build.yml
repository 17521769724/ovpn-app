name: skip-build

# Skip 流水线：仅用于产出 Android APK（SwiftUI 源码转译为 Kotlin + Jetpack Compose）。
# iOS 侧不走 Skip —— Skip 版 IPA 会把业务代码打进 skip-* 动态框架导致启动闪退，
# iOS 固定由 ios-ipa.yml 用原生 Xcode 工程出包。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skip/**'
      - '.github/workflows/skip-build.yml'

env:
  SKIP_APP_DIR: skip/OVPNPanel
  SKIP_SOURCES: skip/OVPNPanel/Sources

jobs:
  # --------------------------------------------------------------- Android APK
  android-apk:
    # Skip 工具链需要 Swift 6.1+（Skip 的 Gradle 预构建会调用 swift 解析包）
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode（确保 Swift 6.1+）
        run: |
          swift --version || true
          if ! swift --version 2>/dev/null | grep -qE "Swift version 6\.[1-9]"; then
            for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
              sudo xcode-select -s "$x"
              if swift --version 2>/dev/null | grep -qE "Swift version 6\.[1-9]"; then break; fi
            done
          fi

      - name: 显示工具链版本
        run: |
          swift --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          gradle --version | head -8

      - name: 安装 Skip 工具链（官方二进制，避免 brew 源码编译约 20 分钟）
        run: |
          if command -v skip >/dev/null 2>&1; then
            echo "Skip 工具链已存在：$(skip --version 2>&1 | head -1)"
          else
            curl -fsSL -o /tmp/skip-macos.zip \
              https://github.com/skiptools/skip/releases/download/1.9.13/skip-macos.zip
            rm -rf /tmp/skipdl && mkdir -p /tmp/skipdl "$HOME/.skip/bin"
            unzip -oq /tmp/skip-macos.zip -d /tmp/skipdl
            cp /tmp/skipdl/skip.artifactbundle/macos/skip "$HOME/.skip/bin/skip"
            chmod +x "$HOME/.skip/bin/skip"
            echo "$HOME/.skip/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.skip/bin:$PATH"
          skip --version || true

      - name: 缓存 Gradle 与 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/Library/Caches/org.swift.swiftpm
          key: skip-gradle-${{ hashFiles('skip/OVPNPanel/Package.swift', 'skip/OVPNPanel/Android/**/*.gradle.kts') }}

      - name: 准备 Gradle Wrapper
        working-directory: ${{ env.SKIP_APP_DIR }}/Android
        run: |
          if [ ! -f gradlew ]; then
            # Skip 生成的工程要求 Gradle 9.4.1+（AGP 版本校验）
            gradle wrapper --gradle-version 9.4.1
          fi
          chmod +x gradlew

      - name: 排障：输出 Skip 生成的 Gradle 工程结构
        working-directory: ${{ env.SKIP_APP_DIR }}
        run: |
          echo "=== 生成的 settings.gradle.kts ==="
          find .build/plugins/outputs -path "*skipstone/settings.gradle.kts" | while read -r f; do
            echo "--- $f"; cat "$f"
          done
          echo "=== 生成的 OVPNPanel/build.gradle.kts ==="
          f="$(find .build/plugins/outputs -path "*skipstone/OVPNPanel/build.gradle.kts" | head -1)"
          if [ -n "$f" ]; then cat "$f"; else echo "(未找到)"; fi

      - name: 构建 Debug APK
        working-directory: ${{ env.SKIP_APP_DIR }}/Android
        run: |
          set -o pipefail
          # 与 Skip 官方模板一致：使用系统 gradle（官方 skip-app 工作流走 Homebrew gradle），
          # 避免 wrapper 版本与 Skip 生成的工程不匹配。
          gradle projects :app:assembleDebug --no-daemon --stacktrace --warning-mode none 2>&1 | tee /tmp/gradle.log | tail -80

      - name: 构建 Release APK（debug 签名，可直接侧载）
        working-directory: ${{ env.SKIP_APP_DIR }}/Android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode none 2>&1 | tee -a /tmp/gradle.log | tail -60

      - name: 校验 APK 信息
        working-directory: ${{ env.SKIP_APP_DIR }}/Android
        run: |
          set -e
          APK="$(find app/build/outputs/apk -name '*.apk' | head -1)"
          echo "APK: $APK"
          ls -lh app/build/outputs/apk/*/*.apk || true
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|application-label" || true

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-apk
          path: ${{ env.SKIP_APP_DIR }}/Android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 失败时输出构建日志摘要
        if: failure()
        run: |
          echo "=== Gradle 错误 ==="
          grep -E "^e: |error:|FAILURE|What went wrong|Caused by" /tmp/gradle.log | head -40 || true
          echo "=== Swift 编译错误上下文 ==="
          grep -n -B2 -A6 "no such module\|error: " /tmp/gradle.log | head -80 || true
