name: windows-exe

# Windows 客户端（WPF / .NET Framework 4.6.2，兼容 Win7 ~ Win11）构建与界面自检。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-exe.yml'

env:
  PROJ: windows/OVPNPanel.Wpf/OVPNPanel.Wpf.csproj

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建界面自检版（asInvoker，免 UAC）
        run: dotnet build "$env:PROJ" -c Release -p:CiSmoke=true -o out/smoke

      - name: 启动并截图（窗口自渲染）
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path "out/smoke/OVPNPanel.exe").Path
          $shots = @(
            @{ n = "setup"; a = @("-winSize","430,700","-theme","light") },
            @{ n = "tab0";  a = @("-demo","-startTab","0","-winSize","430,700","-theme","light") },
            @{ n = "tab1";  a = @("-demo","-startTab","1","-winSize","430,700","-theme","light") },
            @{ n = "tab2";  a = @("-demo","-startTab","2","-winSize","430,700","-theme","light") },
            @{ n = "tab3";  a = @("-demo","-startTab","3","-winSize","430,700","-theme","light") }
          )
          foreach ($s in $shots) {
            $out = (Join-Path $PWD ("win-" + $s.n + ".png"))
            $p = Start-Process -FilePath $exe -ArgumentList ($s.a + @("-shot", $out)) -PassThru
            if (!$p.WaitForExit(30000)) {
              Write-Host "[$($s.n)] 超时未退出，强制结束"
              $p | Stop-Process -Force
            }
            if (!(Test-Path $out)) { throw "[$($s.n)] 未生成截图 $out" }
            Write-Host "[$($s.n)] ok exit=$($p.ExitCode) size=$((Get-Item $out).Length)"
            $trace = "out/smoke/trace.log"
            if (Test-Path $trace) { Get-Content $trace -Tail 3 | Write-Host }
          }
          Get-ChildItem win-*.png | Format-Table Name, Length

      - name: 构建 Release（requireAdministrator 正式版）
        if: always()
        run: dotnet build "$env:PROJ" -c Release -t:Rebuild -o out/release

      - name: 校验产物
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem out/release | Format-Table Name, Length
          $exe = "out/release/OVPNPanel.exe"
          if (!(Test-Path $exe)) { throw "未生成 OVPNPanel.exe" }
          (Get-Item $exe).VersionInfo | Format-List FileVersion, ProductName

      - name: 上传 EXE 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-windows
          path: |
            out/release/OVPNPanel.exe
            out/release/OVPNPanel.exe.config
          retention-days: 30

      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-windows-screenshots
          path: |
            win-*.png
            out/smoke/crash.log
            out/smoke/trace.log
          if-no-files-found: warn
          retention-days: 14
