name: windows-exe

# Windows 客户端（WPF / .NET Framework 4.6.2，兼容 Win7 ~ Win11）构建与界面自检。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-exe.yml'

env:
  PROJ: windows/OVPNPanel.Wpf/OVPNPanel.Wpf.csproj

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 下载并打包 OpenVPN 2.6 内核（内置进 EXE）
        shell: pwsh
        run: |
          # 与服务端 2.6 同版本的内核，随 EXE 以嵌入资源形式交付（开箱即用，无需另装 OpenVPN）
          $urls = @(
            "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.13-I001-amd64.msi",
            "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.12-I001-amd64.msi",
            "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.10-I001-amd64.msi",
            "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.9-I001-amd64.msi"
          )
          $msi = Join-Path $env:RUNNER_TEMP "openvpn.msi"
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $msi -UseBasicParsing -TimeoutSec 180
              Write-Host "已下载：$u"
              $ok = $true; break
            } catch { Write-Host "下载失败：$u -> $($_.Exception.Message)" }
          }

          $bin = $null
          $extract = Join-Path $env:RUNNER_TEMP "ovpn-extract"
          if ($ok) {
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            $p = Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$extract`"" -Wait -PassThru
            if ($p.ExitCode -eq 0) {
              $exe = Get-ChildItem -Path $extract -Recurse -Filter openvpn.exe -File | Select-Object -First 1
              if ($exe) { $bin = $exe.Directory.FullName }
            } else {
              Write-Host "msiexec 解包失败：$($p.ExitCode)"
            }
          }

          # 兜底：MSI 下载/解包失败时用 Chocolatey 安装后取文件
          if (-not $bin) {
            Write-Host "改用 Chocolatey 安装 OpenVPN"
            choco install openvpn --no-progress -y
            foreach ($candidate in @("C:\Program Files\OpenVPN\bin", "C:\Program Files (x86)\OpenVPN\bin")) {
              if (Test-Path (Join-Path $candidate "openvpn.exe")) { $bin = $candidate; break }
            }
          }
          if (-not $bin) { throw "未能获取 OpenVPN 内核文件" }
          Write-Host "内核目录：$bin"
          Get-ChildItem $bin | Format-Table Name, Length

          $stage = Join-Path $env:RUNNER_TEMP "ovpn-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "bin") | Out-Null

          # 运行所需文件：openvpn.exe + 依赖 DLL（含 wintun.dll）+ tapctl.exe
          foreach ($f in @("openvpn.exe", "tapctl.exe")) {
            $src = Join-Path $bin $f
            if (Test-Path $src) { Copy-Item $src (Join-Path $stage "bin") -Force }
          }
          Get-ChildItem $bin -Filter *.dll | ForEach-Object { Copy-Item $_.FullName (Join-Path $stage "bin") -Force }

          # TAP 驱动（Wintun 不可用时的兜底驱动文件）
          $driverFiles = Get-ChildItem -Path (Split-Path $bin -Parent) -Recurse -Include OemVista.inf, tap0901.sys, tap0901.cat -File -ErrorAction SilentlyContinue
          if (-not $driverFiles) { $driverFiles = Get-ChildItem -Path $extract -Recurse -Include OemVista.inf, tap0901.sys, tap0901.cat -File -ErrorAction SilentlyContinue }
          if ($driverFiles) {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage "driver") | Out-Null
            $driverFiles | ForEach-Object { Copy-Item $_.FullName (Join-Path $stage "driver") -Force }
            Write-Host "已打包 TAP 驱动：$($driverFiles.Count) 个文件"
          }

          # Wintun 虚拟网卡（OpenVPN 2.6 的默认驱动；msiexec /a 解包不会释放该组件，需单独补齐）
          $wintun = Get-ChildItem -Path $extract -Recurse -Filter wintun.dll -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wintun) {
            $wintunZip = Join-Path $env:RUNNER_TEMP "wintun.zip"
            foreach ($u in @("https://www.wintun.net/builds/wintun-0.14.1.zip",
                             "https://www.wintun.net/builds/wintun-0.14.zip")) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $wintunZip -UseBasicParsing -TimeoutSec 120
                Write-Host "已下载 Wintun：$u"; break
              } catch { Write-Host "下载失败：$u -> $($_.Exception.Message)" }
            }
            if (Test-Path $wintunZip) {
              $wintunDir = Join-Path $env:RUNNER_TEMP "wintun"
              if (Test-Path $wintunDir) { Remove-Item $wintunDir -Recurse -Force }
              Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
              $wintun = Get-ChildItem -Path $wintunDir -Recurse -Filter wintun.dll -File |
                        Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
            }
          }
          if ($wintun) {
            Copy-Item $wintun.FullName (Join-Path $stage "bin\wintun.dll") -Force
            Write-Host "已打包 Wintun 驱动：$($wintun.FullName)"
          } else {
            Write-Host "::warning::未获取到 wintun.dll，连接将回退系统 TAP 驱动"
          }

          $zip = "windows/OVPNPanel.Wpf/openvpn.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          Write-Host ("openvpn.zip：{0:N1} MB" -f ((Get-Item $zip).Length / 1MB))

          # 校验内置内核完整性（缺 wintun.dll 时连接会失败，这里直接让构建失败以便及时发现）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries | ForEach-Object { $_.FullName }
          Write-Host "openvpn.zip 条目：$($entries -join ', ')"
          if (-not ($entries -contains "bin/openvpn.exe")) { throw "openvpn.zip 缺少 openvpn.exe" }
          if (-not ($entries -contains "bin/wintun.dll")) { throw "openvpn.zip 缺少 wintun.dll（OpenVPN 2.6 默认驱动）" }

      - name: 构建并截图（窗口自渲染）
        continue-on-error: true
        shell: pwsh
        run: |
          # 模拟主控与截图必须同一个 step：跨 step 的后台进程会被回收
          $mock = Start-Process -FilePath "python" -ArgumentList ".github/ui-check/mock_master.py" -PassThru -RedirectStandardOutput mock.log -RedirectStandardError mock.err.log
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            try { Invoke-WebRequest -Uri "http://127.0.0.1:8788/api/v1/lines" -UseBasicParsing -TimeoutSec 2 | Out-Null; $ready = $true; break }
            catch { }
          }
          if (!$ready) { Get-Content mock.err.log -ErrorAction SilentlyContinue | Write-Host; throw "模拟主控启动失败" }
          Write-Host "mock 就绪 (pid=$($mock.Id))"

          dotnet build "windows/OVPNPanel.Wpf/OVPNPanel.Wpf.csproj" -c Release -p:CiSmoke=true -o out/smoke
          $exe = (Resolve-Path "out/smoke/OVPNPanel.exe").Path
          $common = @("-masterURL","http://127.0.0.1:8788","-autoLogin","demo:demo","-noProxy","-winSize","1040,780","-theme","light","-shotDelay","6000")
          $shots = @(
            @{ n = "setup"; a = @("-winSize","1040,780","-theme","light","-shotDelay","2500") },
            @{ n = "tab0";  a = ($common + @("-startTab","0")) },
            @{ n = "tab1";  a = ($common + @("-startTab","1")) },
            @{ n = "tab2";  a = ($common + @("-startTab","2")) },
            @{ n = "tab3";  a = ($common + @("-startTab","3")) }
          )
          foreach ($s in $shots) {
            $out = (Join-Path $PWD ("win-" + $s.n + ".png"))
            $p = Start-Process -FilePath $exe -ArgumentList ($s.a + @("-shot", $out)) -PassThru
            if (!$p.WaitForExit(40000)) {
              Write-Host "[$($s.n)] 超时未退出，强制结束"
              $p | Stop-Process -Force
            }
            if (!(Test-Path $out)) { throw "[$($s.n)] 未生成截图 $out" }
            Write-Host "[$($s.n)] ok exit=$($p.ExitCode) size=$((Get-Item $out).Length)"
          }
          Write-Host "===== trace.log ====="
          Get-Content "out/smoke/trace.log" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "===== crash.log ====="
          Get-Content "out/smoke/crash.log" -ErrorAction SilentlyContinue | Write-Host
          Get-ChildItem win-*.png | Format-Table Name, Length
          $mock | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: 构建 Release（requireAdministrator 正式版）
        if: always()
        run: dotnet build "$env:PROJ" -c Release -t:Rebuild -o out/release

      - name: 校验产物
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem out/release | Format-Table Name, Length
          $exe = "out/release/OVPNPanel.exe"
          if (!(Test-Path $exe)) { throw "未生成 OVPNPanel.exe" }
          (Get-Item $exe).VersionInfo | Format-List FileVersion, ProductName
          Write-Host ("EXE 大小：{0:N1} MB" -f ((Get-Item $exe).Length / 1MB))
          $names = [System.Reflection.Assembly]::LoadFile((Resolve-Path $exe)).GetManifestResourceNames()
          Write-Host "嵌入资源：$($names -join ', ')"
          if (!($names -contains "OVPNPanel.openvpn.zip")) { throw "EXE 未内置 OpenVPN 内核（openvpn.zip）" }

      - name: 上传 EXE 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-windows
          path: |
            out/release/OVPNPanel.exe
            out/release/OVPNPanel.exe.config
          retention-days: 30

      - name: 上传界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-windows-screenshots
          path: |
            win-*.png
            out/smoke/crash.log
            out/smoke/trace.log
          if-no-files-found: warn
          retention-days: 14
