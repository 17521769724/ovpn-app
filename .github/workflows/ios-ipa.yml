name: ios-ipa

# 原生 Xcode 工程（ios/）出 iOS IPA。
# 注意：Skip 版（skip/OVPNPanel）出包会闪退（业务代码在 skip-* 动态框架里加载失败），
# 因此 iOS 侧固定走原生工程，Skip 仅用于 Android。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen 与 ldid
        run: |
          brew install xcodegen
          brew install ldid || echo "ldid 安装失败，后续使用 codesign 兜底"

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          xcodegen generate
          grep -m1 "objectVersion" OVPNPanel.xcodeproj/project.pbxproj || true

      - name: 解析 Swift 包依赖
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OVPNPanel.xcodeproj \
            -scheme OVPNPanel 2>&1 | tail -20

      - name: 构建 App（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild \
            -project OVPNPanel.xcodeproj \
            -scheme OVPNPanel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -40 || STATUS=$?
          echo "=== 编译错误汇总 ==="
          grep -E ": error:" /tmp/xcodebuild.log || echo "(无 error)"
          echo "=== 编译警告汇总 ==="
          grep -E ": warning:" /tmp/xcodebuild.log | grep -v "deprecated" | head -30 || true
          exit $STATUS

      - name: 打包为未签名 IPA（巨魔自签安装，注入 NetworkExtension entitlements）
        working-directory: ios
        run: |
          set -e
          PRODUCTS="build/Build/Products/Release-iphoneos"
          APP="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then echo "未找到 .app 产物"; exit 1; fi
          echo "产物：$APP"

          rm -rf Payload OVPNPanel-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "=== 产物结构 ==="
          find Payload -maxdepth 3 | head -30

          # 优先使用 ldid（TrollStore 会保留 ldid 写入的 entitlements），否则退回 codesign
          sign() {
            local binary="$1"
            local entitlements="$2"
            [ -f "$binary" ] || return 0
            if command -v ldid >/dev/null 2>&1; then
              ldid -S"$entitlements" "$binary"
            else
              codesign -f -s - --entitlements "$entitlements" "$binary"
            fi
          }

          sign "Payload/OVPN.app/OVPN" "Entitlements/OVPNPanel.entitlements"

          EXT_EXEC="Payload/OVPN.app/PlugIns/OVPNTunnel.appex/OVPNTunnel"
          if [ -f "$EXT_EXEC" ]; then
            sign "$EXT_EXEC" "Entitlements/OVPNTunnel.entitlements"
            echo "已为隧道扩展注入 entitlements"
          else
            echo "警告：未找到隧道扩展可执行文件"
          fi

          # 嵌套动态库/框架没有 entitlements，直接沿用原签名
          find Payload -type f \( -name "*.dylib" -o -perm -111 \) ! -name "OVPN" ! -name "OVPNTunnel" \
            -exec sh -c 'file "$1" | grep -q "Mach-O" && ldid -S "$1" 2>/dev/null || true' _ {} \; || true

          zip -qry OVPNPanel-unsigned.ipa Payload
          ls -lh OVPNPanel-unsigned.ipa
          echo "=== 主二进制大小（原生工程应约 5~6 MB；若只有几十 KB 说明误用了 Skip 版） ==="
          ls -l Payload/OVPN.app/OVPN

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: OVPNPanel-ipa
          path: ios/OVPNPanel-unsigned.ipa
          retention-days: 30